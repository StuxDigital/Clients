name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Publish only the site itself: upload-pages-artifact has no exclude
      # option, so the repo's scripts and docs are left out by copying.
      - name: Collect the site files
        run: |
          set -euo pipefail
          mkdir _site
          cp -r index.html 404.html CNAME robots.txt sitemap.xml CHANGELOG.md VERSION.md assets legal changelogs changelog sitemap _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
