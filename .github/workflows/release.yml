name: Release

# Publishes a GitHub Release for commit.sh's vYY.MM.DD tag once that tag is on
# main, with the notes taken from the matching CHANGELOG.md section. The tag is
# pushed from test before the pull request is merged, so a tag push alone does
# nothing until the tagged commit reaches main; the merge into main publishes it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether to publish
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION.md)"
          TAG="v$V"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "No $TAG tag yet for main's VERSION.md ($V); nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "$TAG isn't on main yet; it will be published when it's merged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a Release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            /^## / {
              if (found) exit
              h = $0; sub(/^## \[?v?/, "", h); split(h, a, /[^0-9A-Za-z.+-]/)
              if (a[1] == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
